---
applications:
  - name: employee-churn-app
    path: .
    memory: 768M
    disk_quota: 2G
    instances: 1
    buildpacks:
      - python_buildpack
    command: >-
      exec streamlit run app.py
      --server.address=0.0.0.0
      --server.port=$PORT
      --server.headless=true
      --browser.gatherUsageStats=false
    health-check-type: port
    timeout: 180
    random-route: true
    env:
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
